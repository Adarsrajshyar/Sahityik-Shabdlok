<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="साहित्यिक शब्द लोक पर शायरी, कविता और कहानियाँ खोजें।">
  <title>रचना खोजें | साहित्यिक शब्द लोक</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .search-hero {
      padding: 55px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(120deg, #103725, #245b40);
    }
    .search-hero h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 10px;
    }
    .search-hero p {
      color: #e5ce9d;
    }
    .search-area {
      max-width: 850px;
      margin: 35px auto;
      padding: 25px;
      background: #fffdf6;
      border: 1px solid #e7dfcf;
      border-radius: 12px;
    }
    .search-form {
      display: grid;
      grid-template-columns: 1fr 180px auto;
      gap: 12px;
    }
    .search-form input,
    .search-form select {
      min-width: 0;
      padding: 12px;
      border: 1px solid #d9d5c8;
      border-radius: 7px;
      font: inherit;
    }
    .search-form button {
      padding: 12px 20px;
      color: white;
      background: #174b35;
      border: 0;
      border-radius: 7px;
      font: inherit;
      cursor: pointer;
    }
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 25px 0 60px;
    }
    .result-card {
      padding: 22px;
      background: white;
      border: 1px solid #e7dfcf;
      border-radius: 9px;
    }
    .result-card h2 {
      color: #174b35;
      font-size: 21px;
    }
    .result-card p {
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .result-card a {
      color: #174b35;
      font-weight: 600;
    }
    #search-message {
      text-align: center;
      color: #686e67;
      margin: 20px 0;
    }
    @media (max-width: 650px) {
      .search-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>
    <section class="search-hero">
      <h1>अपनी पसंद की रचना खोजें</h1>
      <p>शायरी, कविता और कहानियों के साहित्यिक संसार में खोजें।</p>
    </section>

    <section class="container">
      <div class="search-area">
        <form id="search-form" class="search-form">
          <input
            type="search"
            id="search-query"
            placeholder="शीर्षक, लेखक या शब्द लिखें..."
            aria-label="रचना खोजें"
          >

          <select id="search-category" aria-label="श्रेणी चुनें">
            <option value="">सभी श्रेणियाँ</option>
            <option value="shayari">शायरी</option>
            <option value="poetry">कविता</option>
            <option value="story">कहानी</option>
          </select>

          <button type="submit">खोजें</button>
        </form>
      </div>

      <div id="search-message" role="status" aria-live="polite">
        प्रकाशित रचनाएँ लोड हो रही हैं...
      </div>

      <div id="search-results" class="search-results"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="search.js"></script>
</body>
</html>
