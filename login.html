
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन / रजिस्ट्रेशन | साहित्यिक शब्द लोक</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap{max-width:480px;margin:35px auto;background:#fff;padding:25px;border:1px solid #e1e8df;border-radius:14px}
    .auth-tabs{display:flex;gap:10px;margin-bottom:20px}
    .auth-tabs button{flex:1;padding:12px;border:1px solid #173D32;border-radius:8px;background:#fff;color:#173D32;cursor:pointer}
    .auth-tabs button.active{background:#173D32;color:#fff}
    .auth-form label{display:block;margin:14px 0 6px;font-weight:600}
    .auth-form input,.auth-form select{width:100%;padding:12px;border:1px solid #cbd5cc;border-radius:8px}
    .auth-form button{width:100%;margin-top:20px;padding:12px;background:#173D32;color:white;border:0;border-radius:8px;cursor:pointer}
    .auth-message{margin-top:15px;line-height:1.7;color:#8b7041}
  </style>
</head>
<body>
<header class="header">
  <a class="brand" href="index.html"><span class="logo">ARS</span><span>साहित्यिक शब्द लोक</span></a>
  <button class="menu-button" aria-label="मेन्यू खोलें">☰</button>
  <nav>
    <a href="index.html">मुखपृष्ठ</a>
    <a href="about.html">हमारे बारे में</a>
    <a href="community.html">लेखक समुदाय</a>
    <a href="contact.html">संपर्क</a>
  </nav>
</header>

<main class="container">
  <section class="page-hero">
    <h1>ARS सदस्य प्रवेश</h1>
    <p>साहित्यिक शब्द लोक के लेखक समुदाय से जुड़ें।</p>
  </section>

  <section class="auth-wrap">
    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">लॉगिन</button>
      <button id="registerTab" type="button">रजिस्ट्रेशन</button>
    </div>

    <form id="loginForm" class="auth-form">
      <h2>अपने अकाउंट में प्रवेश करें</h2>
      <label for="loginEmail">ईमेल</label>
      <input id="loginEmail" type="email" required autocomplete="email" placeholder="अपना ईमेल लिखें">
      <label for="loginPassword">पासवर्ड</label>
      <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="पासवर्ड लिखें">
      <button type="submit">लॉगिन करें</button>
    </form>

    <form id="registerForm" class="auth-form" hidden>
      <h2>नया अकाउंट बनाएँ</h2>
      <label for="fullName">पूरा नाम</label>
      <input id="fullName" type="text" required autocomplete="name" placeholder="अपना नाम लिखें">
      <label for="registerEmail">ईमेल</label>
      <input id="registerEmail" type="email" required autocomplete="email" placeholder="अपना ईमेल लिखें">
      <label for="registerPassword">पासवर्ड</label>
      <input id="registerPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="कम से कम 8 अक्षर">
      <label for="memberType">सदस्य प्रकार</label>
      <select id="memberType" required>
        <option value="reader">पाठक (Reader)</option>
        <option value="author">लेखक (Author)</option>
      </select>
      <button type="submit">रजिस्ट्रेशन करें</button>
    </form>

    <p class="auth-message" id="authMessage" role="status">
      सूचना: वास्तविक Login और Registration सुविधा backend जुड़ने के बाद सक्रिय होगी।
    </p>
  </section>
</main>

<footer class="footer">
  <p>© 2026 साहित्यिक शब्द लोक | ARS</p>
  <a href="https://www.youtube.com/@Adarshshyari" target="_blank" rel="noopener">YouTube</a>
</footer>

<script>
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("authMessage");

function showTab(tab){
  const isLogin = tab === "login";
  loginForm.hidden = !isLogin;
  registerForm.hidden = isLogin;
  loginTab.classList.toggle("active",isLogin);
  registerTab.classList.toggle("active",!isLogin);
  message.textContent = "सूचना: वास्तविक Login और Registration सुविधा backend जुड़ने के बाद सक्रिय होगी।";
}
loginTab.addEventListener("click",()=>showTab("login"));
registerTab.addEventListener("click",()=>showTab("register"));

loginForm.addEventListener("submit",e=>{
  e.preventDefault();
  message.textContent = "अभी Login सेवा सक्रिय नहीं है। Backend configuration पूरी होने के बाद आप लॉगिन कर पाएँगे।";
});
registerForm.addEventListener("submit",e=>{
  e.preventDefault();
  message.textContent = "आपका फॉर्म अभी सर्वर पर जमा नहीं हुआ है। Registration सुविधा backend जुड़ने के बाद सक्रिय होगी।";
});
</script>
<script src="main.js" defer></script>
</body>
</html>
