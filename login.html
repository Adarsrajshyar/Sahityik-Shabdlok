
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="साहित्यिक शब्द लोक में सुरक्षित ईमेल OTP लॉगिन करें।">
  <title>लॉगिन | साहित्यिक शब्द लोक</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap{max-width:500px;margin:45px auto;padding:20px}
    .auth-card{background:#fffdf6;border:1px solid #e4ddc9;border-radius:18px;padding:30px;box-shadow:0 8px 25px #263d2510}
    .auth-card h1{text-align:center;color:#315b38;margin-top:0}
    .auth-intro{text-align:center;color:#777;line-height:1.7;margin-bottom:25px}
    .auth-field{margin:18px 0}
    .auth-field label{display:block;font-weight:600;color:#315b38;margin-bottom:7px}
    .auth-field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9d5c8;border-radius:8px;background:white;font:inherit}
    .auth-submit{width:100%;border:0;border-radius:8px;padding:13px;background:#315b38;color:white;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
    .auth-note{text-align:center;font-size:14px;color:#777;line-height:1.7;margin-top:20px}
    .auth-links{text-align:center;margin-top:20px}
    .auth-links a{color:#315b38;font-weight:600}
    #login-message{margin-top:15px;padding:12px;border-radius:8px;display:none}
    #otp-section{display:none}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <section class="auth-card">
      <h1>स्वागत है!</h1>
      <p class="auth-intro">अपने साहित्यिक शब्द लोक अकाउंट में लॉगिन करें।</p>

      <form id="login-form">
        <div class="auth-field">
          <label for="login-email">रजिस्टर्ड ईमेल पता</label>
          <input type="email" id="login-email" name="email" placeholder="example@email.com" required>
        </div>

        <button type="submit" class="auth-submit" id="send-otp-button">ईमेल OTP भेजें</button>

        <div id="otp-section">
          <div class="auth-field">
            <label for="login-otp">ईमेल पर प्राप्त OTP</label>
            <input type="text" id="login-otp" name="otp" placeholder="OTP दर्ज करें" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
          </div>
          <button type="button" class="auth-submit" id="verify-otp-button">OTP सत्यापित करें और लॉगिन करें</button>
        </div>

        <div id="login-message" role="status" aria-live="polite"></div>
      </form>

      <p class="auth-note">
        लॉगिन के लिए आपके रजिस्टर्ड ईमेल पर OTP भेजा जाएगा। अपना OTP किसी अन्य व्यक्ति के साथ साझा न करें।
      </p>

      <div class="auth-links">
        नया अकाउंट बनाना चाहते हैं? <a href="register.html">रजिस्ट्रेशन करें</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
