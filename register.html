<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174b35">

  <title>पंजीकरण | साहित्यिक शब्द लोक - ARS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Hind:wght@400;500;600&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 85vh;
      display: grid;
      place-items: center;
      padding: 45px 15px;
      background: var(--cream);
    }

    .auth-card {
      width: min(520px, 100%);
      padding: 36px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .auth-logo .brand-mark {
      margin: 0 auto 12px;
    }

    .auth-logo h1 {
      color: var(--green);
      font-family: "Noto Serif Devanagari", serif;
      font-size: 25px;
    }

    .auth-logo p {
      color: var(--muted);
      font-size: 14px;
    }

    .auth-card h2 {
      color: var(--green);
      font-family: "Noto Serif Devanagari", serif;
      font-size: 22px;
      margin-bottom: 7px;
    }

    .auth-description {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .auth-form label {
      display: block;
      margin: 13px 0 6px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .auth-form input,
    .auth-form select,
    .auth-form textarea {
      width: 100%;
      min-height: 45px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      outline: none;
      background: #fff;
      font: inherit;
    }

    .auth-form textarea {
      min-height: 85px;
      resize: vertical;
    }

    .auth-form input:focus,
    .auth-form select:focus,
    .auth-form textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(177, 138, 72, .12);
    }

    .auth-submit {
      width: 100%;
      margin-top: 20px;
      border: 0;
    }

    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 11px;
      border-radius: 5px;
      font-size: 14px;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      background: #fff0ed;
      color: #a52b1b;
    }

    .auth-message.success {
      background: #eaf5ed;
      color: #17653a;
    }

    .otp-section {
      display: none;
    }

    .otp-section.visible {
      display: block;
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .consent-row input {
      width: 17px;
      min-height: 17px;
      margin-top: 4px;
    }

    .auth-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .auth-links a {
      color: var(--green);
      font-weight: 700;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 25px 19px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script type="module" src="auth.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">ARS</span>
        <span class="brand-text">
          <strong>साहित्यिक शब्द लोक</strong>
          <small>शब्दों से संवेदना तक…</small>
        </span>
      </a>

      <a href="login.html" class="btn btn-outline">लॉगिन</a>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card">

      <div class="auth-logo">
        <span class="brand-mark">ARS</span>
        <h1>साहित्यिक शब्द लोक</h1>
        <p>शब्दों से संवेदना तक…</p>
      </div>

      <h2>नया खाता बनाएँ</h2>
      <p class="auth-description">
        पाठक या लेखक के रूप में हमारे साहित्यिक समुदाय से जुड़ें।
      </p>

      <form id="register-form" class="auth-form">

        <div id="register-details">

          <label for="full-name">पूरा नाम *</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            placeholder="अपना पूरा नाम लिखें"
            autocomplete="name"
            maxlength="100"
            required
          >

          <label for="display-name">लेखकीय नाम</label>
          <input
            type="text"
            id="display-name"
            name="display_name"
            placeholder="आप किस नाम से लिखना चाहते हैं?"
            maxlength="60"
          >

          <label for="register-email">ईमेल पता *</label>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="अपना ईमेल लिखें"
            autocomplete="email"
            required
          >

          <label for="user-role">आप किस रूप में जुड़ना चाहते हैं? *</label>
          <select id="user-role" name="requested_role" required>
            <option value="reader">पाठक (Reader)</option>
            <option value="author">लेखक (Author)</option>
          </select>

          <label for="register-bio">अपने बारे में (वैकल्पिक)</label>
          <textarea
            id="register-bio"
            name="bio"
            placeholder="अपने साहित्यिक विचारों या रुचियों के बारे में लिखें..."
            maxlength="500"
          ></textarea>

          <div class="consent-row">
            <input
              type="checkbox"
              id="register-consent"
              name="consent"
              required
            >
            <label for="register-consent">
              मैं वेबसाइट की
              <a href="terms.html">नियम एवं शर्तें</a>
              और
              <a href="privacy.html">गोपनीयता नीति</a>
              स्वीकार करता/करती हूँ।
            </label>
          </div>

          <button type="submit"
                  id="send-register-otp"
                  class="btn btn-primary auth-submit">
            ईमेल पर OTP भेजें
          </button>

        </div>

        <div id="register-otp-section" class="otp-section">

          <p class="auth-description">
            आपके ईमेल पर भेजा गया 6 अंकों का OTP दर्ज करें।
          </p>

          <label for="register-otp">OTP *</label>
          <input
            type="text"
            id="register-otp"
            name="otp"
            placeholder="6 अंकों का OTP"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
          >

          <button type="button"
                  id="register-verify-button"
                  class="btn btn-primary auth-submit">
            OTP सत्यापित करें और खाता बनाएँ
          </button>

          <button type="button"
                  id="resend-register-otp"
                  class="btn btn-outline auth-submit">
            OTP दोबारा भेजें
          </button>

        </div>

        <div id="register-message"
             class="auth-message"
             role="status"
             aria-live="polite"></div>

      </form>

      <div class="auth-links">
        पहले से खाता है?
        <a href="login.html">लॉगिन करें</a>
      </div>

      <a href="index.html" class="back-home">
        ← मुख्य पृष्ठ पर वापस जाएँ
      </a>

    </section>
  </main>

</body>
</html>
