<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="साहित्यिक शब्द लोक पर पढ़ें प्रेम, दर्द, दोस्ती और प्रेरणा से भरी हिंदी शायरी।">
  <title>शायरी | साहित्यिक शब्द लोक</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .listing-hero {
      padding: 65px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(120deg, #103725, #245b40);
    }
    .listing-hero h1 {
      font-size: clamp(30px, 5vw, 44px);
      margin-bottom: 10px;
    }
    .listing-hero p {
      color: #e5ce9d;
    }
    .listing-section {
      min-height: 420px;
      padding: 55px 0 75px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }
    .content-card {
      padding: 25px;
      background: #fff;
      border: 1px solid #e7dfcf;
      border-radius: 9px;
      box-shadow: 0 8px 25px rgba(31, 51, 38, 0.07);
    }
    .content-card h3 {
      color: #174b35;
      margin-bottom: 13px;
      font-size: 21px;
    }
    .content-card p {
      line-height: 2;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .content-card small {
      display: block;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #e7dfcf;
      color: #6f756e;
    }
    #content-message {
      margin-bottom: 18px;
      color: #6f756e;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>
    <section class="listing-hero">
      <div class="container">
        <h1>शायरी की दुनिया</h1>
        <p>अल्फ़ाज़ों में छिपे एहसास, दिल से निकले जज़्बात।</p>
      </div>
    </section>

    <section class="listing-section">
      <div class="container">
        <div class="section-heading">
          <span class="section-label">ARS साहित्य संग्रह</span>
          <h2>प्रकाशित शायरियाँ</h2>
          <p>यहाँ लेखकों की स्वीकृत और प्रकाशित शायरियाँ पढ़ें।</p>
        </div>

        <div id="content-message" role="status" aria-live="polite"></div>
        <div id="content-list" class="content-grid" data-category="shayari">
          <p>शायरियाँ लोड हो रही हैं...</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="content.js"></script>
</body>
</html>
