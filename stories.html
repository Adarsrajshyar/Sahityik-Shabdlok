<script>
const stories = [
{c:"जीवन",t:"एक पुरानी घड़ी",s:"दादाजी की घड़ी बंद थी, लेकिन परिवार के लिए उसका समय आज भी चलता था।",f:"एक छोटे से घर में दादाजी की पुरानी घड़ी दीवार पर टँगी थी। वह कई वर्षों से बंद थी। एक दिन पोते ने पूछा, 'इसे ठीक क्यों नहीं करवाते?' दादाजी बोले, 'यह घड़ी मुझे तुम्हारी दादी की याद दिलाती है। जब यह चलती थी, तब हम दोनों साथ बैठकर समय देखा करते थे।' पोते ने घड़ी ठीक करवाई। उसकी टिक-टिक के साथ घर में पुरानी यादें फिर जीवित हो उठीं। उसे समझ आया कि कुछ चीजों की कीमत उनके काम में नहीं, उनसे जुड़ी यादों में होती है।"},
{c:"जीवन",t:"आखिरी बस",s:"एक अनजान यात्री ने उस दिन एक परिवार की उम्मीद बचा ली।",f:"रात की आखिरी बस स्टेशन से निकलने वाली थी। एक बुजुर्ग महिला टिकट के लिए पैसे गिन रही थीं, लेकिन कुछ रुपये कम पड़ रहे थे। लोग जल्दी में थे। तभी पीछे खड़े एक युवक ने उनका टिकट खरीद दिया। महिला ने धन्यवाद कहा और पूछा, 'बेटा, तुम्हारा नाम?' युवक मुस्कराया, 'नाम जानकर क्या करेंगी? कभी किसी और की मदद कर दीजिएगा।' बस चल पड़ी। उस दिन महिला को मंजिल से ज्यादा इंसानियत याद रही।"},
{c:"जीवन",t:"खाली कुर्सी",s:"घर की एक खाली कुर्सी ने परिवार को साथ बैठना सिखाया।",f:"घर में एक कुर्सी हमेशा खाली रहती थी। उस पर कोई सामान नहीं रखा जाता था। परिवार के मुखिया कहते थे कि इस कुर्सी पर बैठकर हर सदस्य अपनी बात कह सकता है। धीरे-धीरे घर के लोग अपने मन की बातें साझा करने लगे। छोटी गलतफहमियाँ बातचीत से सुलझने लगीं। एक दिन बेटी ने कहा, 'यह कुर्सी खाली नहीं है, इस पर हमारा भरोसा बैठता है।' परिवार ने उस दिन समझा कि घर केवल दीवारों से नहीं, संवाद से बनता है।"},
{c:"जीवन",t:"मिट्टी की खुशबू",s:"शहर लौटे युवक को गाँव की मिट्टी ने अपनी जड़ों का अर्थ समझाया।",f:"कई वर्षों बाद मोहन अपने गाँव लौटा। शहर की चमक ने उसे बहुत कुछ दिया था, लेकिन मन में एक खालीपन था। बारिश शुरू हुई तो मिट्टी की खुशबू उठी। उसे बचपन, खेत और माँ की आवाज याद आने लगी। उसने पिता से कहा, 'मैं यहाँ कुछ दिन और रुकना चाहता हूँ।' पिता ने मुस्कराकर कहा, 'जड़ों से मिलने के लिए किसी अनुमति की जरूरत नहीं होती।' मोहन ने जाना कि आगे बढ़ना जरूरी है, लेकिन अपनी जड़ों को भूलना नहीं।"},
{c:"जीवन",t:"चाय का कप",s:"एक कप चाय ने दो पुराने दोस्तों की चुप्पी तोड़ दी।",f:"रवि और अमन कई वर्षों से बात नहीं कर रहे थे। एक दिन वे पुराने चायवाले की दुकान पर आमने-सामने आ गए। चायवाले ने बिना पूछे दो कप चाय रख दी। दोनों चुप रहे। फिर रवि ने कहा, 'चीनी आज भी कम ही रखते हो?' अमन हँस पड़ा। एक छोटी-सी बात ने वर्षों की दूरी कम कर दी। उन्होंने समझा कि रिश्तों में कभी-कभी एक साधारण शुरुआत ही काफी होती है।"},
{c:"जीवन",t:"बेटी का पत्र",s:"एक बेटी के छोटे पत्र ने पिता को अपनी व्यस्तता पर सोचने को मजबूर किया।",f:"पिता रोज देर से घर आते थे। एक दिन मेज पर बेटी का पत्र मिला—'पापा, मुझे महँगे खिलौने नहीं चाहिए। बस रविवार को आपके साथ पार्क जाना है।' पिता ने पत्र कई बार पढ़ा। अगले रविवार उन्होंने काम से छुट्टी ली और बेटी के साथ पूरा दिन बिताया। बेटी के चेहरे की खुशी देखकर उन्हें एहसास हुआ कि परिवार को समय देना भी जिम्मेदारी है।"},
{c:"जीवन",t:"पुराना पुल",s:"एक पुल ने दो गाँवों के साथ दो पीढ़ियों को भी जोड़ दिया।",f:"नदी पर बना पुराना पुल बरसों से गाँवों को जोड़ता था। बारिश में वह कमजोर हो गया। गाँव के युवाओं ने मिलकर उसकी मरम्मत के लिए प्रशासन को आवेदन दिया। बुजुर्गों ने भी अपना अनुभव साझा किया। कुछ महीनों बाद नया पुल बना। उद्घाटन के दिन एक बुजुर्ग बोले, 'हमने नदी पार करने का रास्ता बनाया था, तुमने मिलकर आने वाली पीढ़ियों का रास्ता बनाया है।'"},
{c:"जीवन",t:"एक पौधा",s:"बच्चे ने अपने जन्मदिन पर पेड़ लगाकर खुशी का नया अर्थ खोजा।",f:"जन्मदिन पर आरव को कई उपहार मिले। लेकिन उसने अपने दादा से एक पौधा माँगा। दोनों ने घर के आँगन में उसे लगाया। आरव रोज पानी देता और उसकी बढ़त देखता। वर्षों बाद पौधा बड़ा पेड़ बन गया। गर्मी के दिन पड़ोसी उसके नीचे बैठने लगे। आरव ने जाना कि कुछ उपहार समय के साथ और भी मूल्यवान हो जाते हैं।"},
{c:"जीवन",t:"बिना नाम की मदद",s:"एक अनजान व्यक्ति की सहायता ने पूरे मोहल्ले में बदलाव ला दिया।",f:"मोहल्ले की सड़क पर रोज कचरा जमा होता था। एक सुबह लोगों ने देखा कि सड़क साफ है। किसी को पता नहीं था कि यह किसने किया। अगले दिन दो लोग और सफाई करने लगे। फिर कुछ बच्चों ने भी साथ दिया। धीरे-धीरे पूरा मोहल्ला साफ रहने लगा। किसी ने उस पहले व्यक्ति को नहीं देखा, लेकिन उसके काम ने सबको प्रेरित कर दिया।"},
{c:"जीवन",t:"वापसी का रास्ता",s:"गलती मान लेने से एक भाई-बहन का रिश्ता फिर जुड़ गया।",f:"दो भाई-बहन छोटी-सी बात पर अलग हो गए थे। त्योहार आया तो दोनों अपने-अपने घरों में उदास थे। छोटी बहन ने पहले संदेश भेजा, 'मुझसे गलती हुई।' भाई ने जवाब दिया, 'मुझसे भी।' अगले दिन दोनों मिले। उन्हें समझ आया कि जीतने की जिद में वे रिश्ता हार रहे थे। उस दिन उन्होंने तय किया कि नाराजगी से पहले बातचीत करेंगे।"},

{c:"प्रेरणा",t:"पहली सीढ़ी",s:"छोटे कदमों ने एक विद्यार्थी को बड़े लक्ष्य तक पहुँचाया।",f:"सोनू पढ़ाई में कमजोर था। उसे लगता था कि वह कभी परीक्षा में सफल नहीं होगा। शिक्षक ने कहा, 'आज केवल एक विषय का एक अध्याय पूरा करो।' सोनू ने यही नियम अपनाया। हर दिन थोड़ा पढ़ा, गलतियों को समझा और अभ्यास किया। परीक्षा के दिन वह आत्मविश्वास से भरा था। परिणाम अच्छा आया। उसे समझ आया कि बड़ी मंजिल की शुरुआत छोटी सीढ़ी से होती है।"},
{c:"प्रेरणा",t:"टूटी पेंसिल",s:"एक छोटी पेंसिल ने बच्चे को प्रयास जारी रखने की सीख दी।",f:"परीक्षा से पहले रिया की पेंसिल टूट गई। वह घबरा गई। शिक्षक ने दूसरी पेंसिल दी और कहा, 'पेंसिल टूट सकती है, तुम्हारा प्रयास नहीं।' रिया ने परीक्षा पूरी की। बाद में उसने उस टूटी पेंसिल को अपनी मेज पर रख लिया। जब भी कठिनाई आती, वह उसे देखकर याद करती कि साधन बदल सकते हैं, लेकिन हिम्मत नहीं।"},
{c:"प्रेरणा",t:"छोटा आविष्कार",s:"एक विद्यार्थी ने साधारण समस्या का उपयोगी समाधान खोजा।",f:"गाँव के स्कूल में बारिश के दिनों में जूते गीले हो जाते थे। कक्षा आठ के छात्र ने पुराने डिब्बों और लकड़ी से जूते रखने का ढका हुआ स्टैंड बनाया। शुरुआत में बच्चे हँसे, लेकिन बरसात में सभी को उसका फायदा मिला। प्रधानाध्यापक ने उसे विज्ञान प्रदर्शनी में भेजा। छात्र ने जाना कि आविष्कार हमेशा बड़ी प्रयोगशाला में नहीं, जरूरत को समझने से शुरू होते हैं।"},
{c:"प्रेरणा",t:"अधूरा नक्शा",s:"लक्ष्य का रास्ता बदलने पर भी मंजिल नहीं बदलनी चाहिए।",f:"मीरा ने अपने भविष्य का एक नक्शा बनाया था। परिस्थितियों के कारण उसे अपनी योजना बदलनी पड़ी। वह निराश हुई, लेकिन शिक्षक ने कहा, 'नक्शा रास्ता दिखाता है, रास्ता बंद हो जाए तो नया बनाओ।' मीरा ने नए कौशल सीखे और दूसरे अवसर तलाशे। कुछ वर्षों बाद वह अपने क्षेत्र में सफल हुई। उसका पुराना नक्शा अधूरा था, लेकिन उसका सपना नहीं।"},
{c:"प्रेरणा",t:"हार का प्रमाणपत्र",s:"एक असफल प्रयास ने खिलाड़ी को बेहतर तैयारी करना सिखाया।",f:"कबड्डी प्रतियोगिता में टीम हार गई। कप्तान ने हार का प्रमाणपत्र दीवार पर लगाया। साथी हैरान हुए। उसने कहा, 'यह हमें याद दिलाएगा कि अगली बार तैयारी कैसी करनी है।' टीम ने अपनी कमजोरियों पर काम किया। अगले वर्ष उन्होंने बेहतर प्रदर्शन किया। उन्हें समझ आया कि हार अंत नहीं, सुधार का अवसर हो सकती है।"},
{c:"प्रेरणा",t:"पुस्तकालय की रोशनी",s:"एक छोटे पुस्तकालय ने कई बच्चों के सपनों को दिशा दी।",f:"गाँव में शाम को बिजली अक्सर चली जाती थी। एक शिक्षक ने पुराने कमरे में सौर लैंप लगाकर छोटा पुस्तकालय शुरू किया। बच्चे वहाँ पढ़ने आने लगे। धीरे-धीरे किताबें और स्वयंसेवक जुड़ते गए। कुछ वर्षों बाद उसी गाँव के कई विद्यार्थी उच्च शिक्षा तक पहुँचे। एक दीपक से शुरू हुई कोशिश ने पूरे समुदाय में पढ़ने की आदत जगाई।"},
{c:"प्रेरणा",t:"दस मिनट",s:"रोज के दस मिनट ने एक विद्यार्थी की आदत बदल दी।",f:"अंकित को अंग्रेजी बोलने में झिझक होती थी। उसने रोज केवल दस मिनट जोर से पढ़ने का नियम बनाया। पहले वह अटकता था, फिर धीरे-धीरे सहज होने लगा। उसने अपनी आवाज रिकॉर्ड की और सुधार सुना। कुछ महीनों बाद वह कक्षा में बोलने लगा। उसे पता चला कि निरंतर अभ्यास का छोटा समय भी बड़ा बदलाव ला सकता है।"},
{c:"प्रेरणा",t:"माँ का विश्वास",s:"परिवार के विश्वास ने एक लड़की को अपना हुनर दिखाने का साहस दिया।",f:"निधि चित्र बनाना चाहती थी, लेकिन उसे डर था कि लोग क्या कहेंगे। उसकी माँ ने उसके चित्रों को एक छोटी प्रदर्शनी में लगाने का सुझाव दिया। शुरुआत में कुछ ही लोग आए। उनमें से एक कला शिक्षक ने उसे मार्गदर्शन दिया। निधि ने अभ्यास जारी रखा। उसे समझ आया कि प्रतिभा को अवसर और मेहनत दोनों चाहिए।"},
{c:"प्रेरणा",t:"नई शुरुआत",s:"गलतियों से सीखकर एक दुकानदार ने अपना काम फिर सँवारा।",f:"रमेश की छोटी दुकान घाटे में चली गई। उसने जल्दबाजी में लिए गए फैसलों की समीक्षा की। ग्राहकों से बात की, खर्च का हिसाब बनाया और जरूरत के अनुसार सामान रखा। कुछ समय बाद दुकान फिर चलने लगी। उसने अपने अनुभव को असफलता नहीं, सीख माना। नई शुरुआत के लिए उसे पहले अपनी गलतियाँ स्वीकार करनी पड़ीं।"},
{c:"प्रेरणा",t:"आसमान की ओर",s:"एक बच्चे ने सवाल पूछना बंद नहीं किया और नई राह खोजी।",f:"कक्षा में विज्ञान पढ़ते समय कबीर बार-बार सवाल पूछता था। कुछ लोग उसे बहुत जिज्ञासु कहते, कुछ परेशान होते। एक दिन शिक्षक ने उसे तारों पर प्रोजेक्ट बनाने को कहा। कबीर ने किताबें पढ़ीं और मॉडल तैयार किया। उसकी प्रस्तुति को पुरस्कार मिला। उसने जाना कि जिज्ञासा ज्ञान की पहली सीढ़ी है।"},

{c:"सामाजिक",t:"पानी की बूँद",s:"गाँव ने मिलकर पानी बचाने का रास्ता बनाया।",f:"गर्मी में गाँव का कुआँ सूखने लगा। लोग एक-दूसरे को दोष देने लगे। स्कूल की शिक्षिका ने बैठक बुलाई। सबने मिलकर वर्षा जल संचयन और तालाब की सफाई का निर्णय लिया। काम आसान नहीं था, लेकिन हर परिवार ने योगदान दिया। अगले वर्ष बारिश का पानी जमा हुआ और जलस्तर सुधरा। गाँव ने सीखा कि साझा समस्या का समाधान भी साझा प्रयास से आता है।"},
{c:"सामाजिक",t:"एक समान बेंच",s:"स्कूल की एक बेंच ने बच्चों को बराबरी का महत्व समझाया।",f:"कक्षा में कुछ बच्चे अलग बैठते थे क्योंकि वे अलग-अलग आर्थिक परिस्थितियों से आते थे। नए शिक्षक ने बैठने की व्यवस्था बदलकर सभी को मिलाकर बैठाया। बच्चों ने साथ पढ़ना, खेलना और एक-दूसरे की मदद करना शुरू किया। कुछ दिनों बाद किसी को याद भी नहीं रहा कि पहले कौन कहाँ बैठता था। सम्मान और समान अवसर से ही अच्छा विद्यालय बनता है।"},
{c:"सामाजिक",t:"सड़क का दीपक",s:"मोहल्ले के लोगों ने मिलकर अँधेरी गली को सुरक्षित बनाया।",f:"एक गली में रात को अंधेरा रहता था। कई बार लोगों को आने-जाने में परेशानी होती। मोहल्ले के युवाओं ने नगर निकाय में आवेदन दिया और स्थानीय लोगों ने निगरानी की। कुछ दिनों बाद वहाँ स्ट्रीट लाइट लग गई। लोगों ने तय किया कि सार्वजनिक समस्या देखकर चुप नहीं रहेंगे। छोटे नागरिक प्रयास भी बड़ा बदलाव ला सकते हैं।"},
{c:"सामाजिक",t:"किताबों का सफर",s:"पुरानी किताबों ने जरूरतमंद विद्यार्थियों तक नई उम्मीद पहुँचाई।",f:"स्कूल में कई बच्चों के पास किताबें खरीदने के साधन नहीं थे। कुछ वरिष्ठ विद्यार्थियों ने अपनी पुरानी किताबें इकट्ठी कीं। शिक्षकों ने उन्हें व्यवस्थित करके पुस्तक बैंक बनाया। अगले सत्र में जूनियर बच्चों को किताबें मिल गईं। यह व्यवस्था हर वर्ष चलने लगी। किताबें पुरानी थीं, लेकिन उनसे मिलने वाला ज्ञान नया था।"},
{c:"सामाजिक",t:"साफ नदी",s:"नदी को बचाने के लिए गाँव ने अपनी आदतें बदलीं।",f:"गाँव की नदी में कचरा बढ़ने लगा था। कुछ युवाओं ने सफाई अभियान शुरू किया, लेकिन जल्द ही समझ आया कि केवल सफाई पर्याप्त नहीं। उन्होंने लोगों को कचरा अलग रखने और नदी में अपशिष्ट न डालने के लिए जागरूक किया। पंचायत ने भी व्यवस्था बनाई। धीरे-धीरे नदी का किनारा साफ रहने लगा। बदलाव तब आया जब लोगों ने अपनी जिम्मेदारी समझी।"},
{c:"सामाजिक",t:"सबका त्योहार",s:"एक मोहल्ले ने अलग-अलग परंपराओं के बीच दोस्ती का पुल बनाया।",f:"मोहल्ले में अलग-अलग परिवार अपने त्योहार मनाते थे। एक वर्ष बच्चों ने तय किया कि वे हर उत्सव में एक-दूसरे की मदद करेंगे। कोई सजावट करता, कोई पानी बाँटता, कोई सफाई में हाथ बँटाता। बड़ों ने भी उनका साथ दिया। मोहल्ले में त्योहार केवल रस्म नहीं रहे, बल्कि आपसी सम्मान और सहयोग का अवसर बन गए।"},
{c:"सामाजिक",t:"ईमानदार रिक्शावाला",s:"एक रिक्शाचालक ने ईमानदारी से पूरे शहर का विश्वास जीता।",f:"एक दिन श्याम को रिक्शे में एक बैग मिला। उसमें जरूरी कागजात और कुछ पैसे थे। उसने बैग पुलिस चौकी में जमा करा दिया। मालिक ने लौटकर धन्यवाद दिया और इनाम देना चाहा। श्याम ने कहा, 'मुझे मेरा काम मिल गया, यही काफी है।' उसकी बात सुनकर चौकी के अधिकारी ने उसे सम्मानित किया। ईमानदारी का मूल्य किसी इनाम से बड़ा होता है।"},
{c:"सामाजिक",t:"पेड़ की छाँव",s:"एक पेड़ बचाने के लिए बच्चों ने पूरे गाँव को साथ जोड़ा।",f:"सड़क चौड़ी करने के लिए पुराने बरगद को काटने की योजना बनी। बच्चों ने पेड़ के नीचे बैठकर उसके महत्व पर पोस्टर बनाए। उन्होंने अधिकारियों से वैकल्पिक योजना पर विचार करने का अनुरोध किया। इंजीनियरों ने नक्शे में बदलाव किया और पेड़ बच गया। बच्चों ने सीखा कि विकास और प्रकृति के बीच संतुलन जरूरी है।"},
{c:"सामाजिक",t:"सुनने वाला शिक्षक",s:"एक शिक्षक ने बच्चों की बात सुनकर कक्षा का माहौल बदल दिया।",f:"कक्षा में कई बच्चे सवाल पूछने से डरते थे। नई शिक्षिका ने हर शुक्रवार 'खुली बातचीत' का समय रखा। बच्चे अपनी कठिनाइयाँ और सुझाव बताने लगे। शिक्षिका ने पढ़ाने का तरीका बदला और सहपाठी सहायता समूह बनाए। धीरे-धीरे बच्चों की भागीदारी बढ़ी। उन्हें महसूस हुआ कि शिक्षा केवल बोलने से नहीं, ध्यान से सुनने से भी बेहतर होती है।"},
{c:"सामाजिक",t:"मिलकर बना रास्ता",s:"दो गाँवों ने सहयोग से बच्चों के स्कूल जाने का रास्ता सुधारा।",f:"दो गाँवों के बीच का रास्ता बारिश में कीचड़ से भर जाता था। बच्चे स्कूल देर से पहुँचते। दोनों गाँवों के लोगों ने पंचायत के साथ बैठक की और श्रमदान किया। स्थानीय प्रशासन से सामग्री मिली। कुछ दिनों में रास्ता चलने योग्य हो गया। लोगों ने जाना कि साझा जरूरतें सीमाएँ छोटी कर देती हैं।"},

{c:"रहस्य",t:"कमरे की रोशनी",s:"बंद कमरे में जलती रोशनी का रहस्य एक छोटी-सी भूल निकला।",f:"पुराने घर के ऊपर वाले कमरे में हर रात रोशनी दिखाई देती थी, जबकि वहाँ कोई नहीं रहता था। परिवार ने कई तरह की कल्पनाएँ बना लीं। एक शाम बिजली मिस्त्री को बुलाया गया। उसने देखा कि खिड़की के पास लगा स्विच ढीला था और हवा से पर्दा हिलकर उसे छू रहा था। रोशनी अपने आप जलती-बुझती थी। रहस्य का उत्तर डर में नहीं, जाँच में छिपा था।"},
{c:"रहस्य",t:"पुरानी डायरी",s:"एक डायरी ने परिवार के भूले हुए इतिहास का पता दिया।",f:"अलमारी साफ करते समय अनया को एक पुरानी डायरी मिली। उसमें तारीखों के साथ छोटे-छोटे संकेत लिखे थे। उसने दादी से पूछा। दादी ने बताया कि यह उसके परदादा की यात्रा डायरी थी। संकेतों को समझते हुए परिवार को पुराने गाँव और रिश्तेदारों के बारे में जानकारी मिली। जिस डायरी को सब बेकार समझ रहे थे, वह इतिहास की चाबी बन गई।"},
{c:"रहस्य",t:"तीसरी घंटी",s:"स्कूल में सुनाई देने वाली तीसरी घंटी का कारण एक पुरानी व्यवस्था थी।",f:"स्कूल बंद होने के बाद भी कभी-कभी घंटी बजती थी। चौकीदार ने कई रातें कारण खोजने में बिताईं। एक दिन उसने पुराने बिजली पैनल की जाँच करवाई। पता चला कि टाइमर में पुरानी सेटिंग बची हुई थी। उसे ठीक करते ही घंटी बजना बंद हो गई। बच्चों ने सीखा कि अनजानी आवाज का कारण खोजने के लिए धैर्य चाहिए।"},
{c:"रहस्य",t:"नीले निशान",s:"दीवार पर बनते नीले निशानों का कारण बारिश का पानी था।",f:"घर की दीवार पर हर बारिश के बाद नीले धब्बे उभर आते। परिवार ने कई अनुमान लगाए। मिस्त्री ने छत और पाइप की जाँच की। एक पुराने रंगीन कपड़े से रिसता पानी दीवार तक पहुँच रहा था। कपड़ा हटाया गया और रिसाव बंद किया गया। निशान गायब हो गए। समस्या का हल तब मिला जब अनुमान छोड़कर ध्यान से जाँच की गई।"},
{c:"रहस्य",t:"गुम होती किताबें",s:"पुस्तकालय से किताबें गायब होने का कारण एक गलत रजिस्टर था।",f:"पुस्तकालय में किताबें कम होती जा रही थीं। सबको चोरी का शक हुआ। पुस्तकालयाध्यक्ष ने रिकॉर्ड जाँचा तो पता चला कि कई किताबें दूसरे कमरे में रखी थीं, लेकिन रजिस्टर अपडेट नहीं हुआ था। बच्चों ने मिलकर सूची बनाई और हर किताब पर नंबर लगाया। कुछ भी चोरी नहीं हुआ था। सही व्यवस्था ने संदेह दूर कर दिया।"},
{c:"रहस्य",t:"आधी रात का संदेश",s:"रात में आने वाला अनजान संदेश एक पुराने स्वचालित अलार्म का था।",f:"एक घर में हर रात ठीक बारह बजे मोबाइल पर एक खाली संदेश आता। परिवार परेशान हो गया। तकनीकी जानकार ने फोन की सेटिंग देखी। एक पुराने सुरक्षा ऐप में परीक्षण संदेश का समय तय था। ऐप बंद करते ही संदेश आना बंद हो गया। परिवार ने राहत की साँस ली और सीखा कि तकनीक की सेटिंग समझना भी जरूरी है।"},
{c:"रहस्य",t:"बगीचे के पदचिह्न",s:"बगीचे में बने निशानों का रहस्य सुबह की एक छोटी मेहमान थी।",f:"हर सुबह बगीचे की मिट्टी पर छोटे निशान मिलते। माली सोचता कि कोई रात में आता है। उसने एक दिन सुबह जल्दी उठकर देखा। एक छोटी बिल्ली दीवार से उतरकर पौधों के बीच घूमती थी। वह मिट्टी में पंजे छोड़ जाती। माली ने उसके लिए पानी रखा और पौधों के पास सुरक्षित जगह बनाई। रहस्य का अंत एक प्यारी दोस्ती से हुआ।"},
{c:"रहस्य",t:"पुराना रेडियो",s:"बंद रेडियो से आती आवाज का कारण पास का प्रसारण था।",f:"दुकान के कोने में रखा पुराना रेडियो कभी-कभी धीमी आवाज करने लगता। मालिक ने उसे खराब समझकर अलग रख दिया था। एक रेडियो तकनीशियन ने बताया कि उसके तार और पास के उपकरण संकेत पकड़ रहे थे। मरम्मत के बाद रेडियो फिर साफ बजने लगा। दुकानदार ने उसे फेंकने के बजाय दुकान की यादों के रूप में सँभाल लिया।"},
{c:"रहस्य",t:"छत पर कदम",s:"रात में छत पर सुनाई देने वाली आहट का कारण ढीली टिन शीट थी।",f:"हवा चलने पर छत से कदमों जैसी आवाज आती। घर के बच्चे डरने लगे। पिता ने दिन में छत की जाँच की। एक टिन शीट ढीली थी और हवा से हिलती थी। उसे ठीक कर दिया गया। उस रात घर शांत रहा। बच्चों ने जाना कि डर लगने पर किसी बड़े को बताना और कारण की सुरक्षित जाँच करना बेहतर है।"},
{c:"रहस्य",t:"अंतिम पन्ना",s:"किताब के आखिरी पन्ने पर छिपा संकेत एक भूले हुए संदेश तक ले गया।",f:"पुरानी किताब के अंतिम पन्ने पर पेंसिल से एक तारीख लिखी थी। आरव ने परिवार के पुराने कागजात में वही तारीख खोजी। उसे एक पत्र मिला जिसमें दादी के स्कूल पुरस्कार का उल्लेख था। दादी ने बताया कि उन्होंने वह किताब अपने पहले पुरस्कार से खरीदी थी। आरव को समझ आया कि कभी-कभी सबसे बड़ा रहस्य किसी अपने की यादों में छिपा होता है।"}
];

const grid = document.getElementById("storyGrid");
const search = document.getElementById("storySearch");
const category = document.getElementById("storyCategory");
const count = document.getElementById("storyCount");

function renderStories(){
  const q = search.value.trim().toLowerCase();
  const cat = category.value;
  const filtered = stories.filter(x =>
    (cat === "सभी" || x.c === cat) &&
    (x.t.toLowerCase().includes(q) || x.s.toLowerCase().includes(q) || x.f.toLowerCase().includes(q))
  );
  count.textContent = `कुल ${filtered.length} कहानियाँ`;
  grid.innerHTML = "";
  filtered.forEach(x => {
    const card = document.createElement("article");
    card.className = "story-card";
    const tag = document.createElement("span");
    tag.className = "story-tag";
    tag.textContent = x.c;
    const title = document.createElement("h3");
    title.textContent = x.t;
    const short = document.createElement("p");
    short.className = "story-short";
    short.textContent = x.s;
    const full = document.createElement("p");
    full.className = "story-full";
    full.textContent = x.f;
    const btn = document.createElement("button");
    btn.textContent = "पूरी कहानी पढ़ें";
    btn.addEventListener("click", () => {
      card.classList.toggle("open");
      btn.textContent = card.classList.contains("open") ? "संक्षेप देखें" : "पूरी कहानी पढ़ें";
    });
    card.append(tag,title,short,full,btn);
    grid.appendChild(card);
  });
}
search.addEventListener("input",renderStories);
category.addEventListener("change",renderStories);
renderStories();
</script>
