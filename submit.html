
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="साहित्यिक शब्द लोक पर अपनी मौलिक रचना जमा करें।">
  <title>रचना भेजें | साहित्यिक शब्द लोक</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .submit-wrap{max-width:760px;margin:35px auto;padding:20px}
    .submit-card{background:#fffdf6;border:1px solid #e5dfcc;border-radius:18px;padding:28px;box-shadow:0 8px 25px #263d2510}
    .submit-card h1{color:#315b38;margin-top:0}
    .submit-intro{color:#777;line-height:1.8}
    .form-field{margin:18px 0}
    .form-field label{display:block;color:#315b38;font-weight:600;margin-bottom:7px}
    .form-field input,.form-field select,.form-field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9d5c8;border-radius:8px;font:inherit;background:white}
    .form-field textarea{min-height:220px;resize:vertical;line-height:1.8}
    .submit-button{background:#315b38;color:white;border:0;border-radius:8px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer}
    .submit-note{background:#f0f4e9;padding:14px;border-radius:9px;color:#52634d;line-height:1.7;margin:18px 0}
    #submission-message{display:none;margin-top:16px;padding:12px;border-radius:8px}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="submit-wrap">
    <section class="submit-card">
      <h1>अपनी रचना भेजें</h1>
      <p class="submit-intro">अपनी मौलिक शायरी, कविता या कहानी साहित्यिक शब्द लोक के साथ साझा करें।</p>

      <div class="submit-note">
        <strong>ध्यान दें:</strong> रचना जमा करने के बाद उसकी समीक्षा की जाएगी। प्रकाशित होने की पुष्टि मिलने के बाद ही वह वेबसाइट पर दिखाई देगी। केवल प्रकाशित रचनाओं के लिए प्रकाशन प्रमाणपत्र जारी किया जा सकता है।
      </div>

      <form id="submission-form">
        <div class="form-field">
          <label for="work-title">रचना का शीर्षक</label>
          <input type="text" id="work-title" name="title" maxlength="150" required placeholder="अपनी रचना का शीर्षक लिखें">
        </div>

        <div class="form-field">
          <label for="work-type">रचना का प्रकार</label>
          <select id="work-type" name="type" required>
            <option value="">चुनें</option>
            <option value="shayari">शायरी</option>
            <option value="poetry">कविता</option>
            <option value="story">कहानी</option>
          </select>
        </div>

        <div class="form-field">
          <label for="work-category">श्रेणी</label>
          <select id="work-category" name="category" required>
            <option value="">पहले रचना का प्रकार चुनें</option>
          </select>
        </div>

        <div class="form-field">
          <label for="work-content">अपनी पूरी रचना लिखें</label>
          <textarea id="work-content" name="content" required minlength="20" maxlength="20000" placeholder="यहाँ अपनी मौलिक रचना लिखें..."></textarea>
        </div>

        <div class="form-field">
          <label for="pen-name">लेखकीय नाम</label>
          <input type="text" id="pen-name" name="penName" maxlength="80" placeholder="यदि अलग हो">
        </div>

        <label style="display:flex;gap:9px;align-items:flex-start;color:#666;line-height:1.6">
          <input type="checkbox" id="original-work" required style="margin-top:5px">
          <span>मैं पुष्टि करता/करती हूँ कि यह मेरी मौलिक रचना है और इसे प्रकाशित करने का अधिकार मेरे पास है।</span>
        </label>

        <p style="margin-top:20px">
          <button type="submit" class="submit-button">रचना समीक्षा के लिए भेजें</button>
        </p>
        <div id="submission-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="content.js"></script>
</body>
</html>
