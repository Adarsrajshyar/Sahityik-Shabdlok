<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>पेज नहीं मिला | साहित्यिक शब्द लोक</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3e9d2;
      font-family: "Hind", sans-serif;
    }
    .error-card {
      width: min(90%, 600px);
      padding: 45px 25px;
      text-align: center;
      background: #fffdf6;
      border: 1px solid #e7dfcf;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(31, 51, 38, 0.09);
    }
    .error-number {
      margin: 0;
      color: #174b35;
      font-size: clamp(70px, 15vw, 120px);
      line-height: 1.1;
    }
    .error-card h1 {
      color: #174b35;
      margin: 12px 0;
    }
    .error-card p {
      color: #60675f;
      line-height: 1.8;
    }
    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      color: white;
      background: #174b35;
      border-radius: 7px;
      text-decoration: none;
      font-weight: 600;
    }
    .home-button:hover {
      background: #103725;
    }
  </style>
</head>

<body>
  <main class="error-card">
    <p class="error-number">404</p>
    <h1>यह पेज नहीं मिला!</h1>
    <p>
      ऐसा लगता है कि आप जिस पेज को खोज रहे हैं,
      वह उपलब्ध नहीं है या उसका पता बदल गया है।
    </p>
    <a class="home-button" href="index.html">
      मुख्य पृष्ठ पर वापस जाएँ
    </a>
  </main>
</body>
</html>
